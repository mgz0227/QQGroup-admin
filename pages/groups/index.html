<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QQ群审核管理</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div>
          <h1>QQ群审核管理</h1>
          <p>优先在目标群发送 <code>/审核设置</code> 并点击按钮绑定，此处统一调整已绑定群。</p>
        </div>
        <div class="header-actions">
          <button class="button icon-button" id="refresh-button" type="button" aria-label="刷新" title="刷新">&#8635;</button>
        </div>
      </header>

      <section class="stats" aria-label="审核概览">
        <div class="stat"><strong id="stat-total">-</strong><span>群总数</span></div>
        <div class="stat"><strong id="stat-bound">-</strong><span>已绑定</span></div>
        <div class="stat"><strong id="stat-active">-</strong><span>运行中</span></div>
        <div class="stat"><strong id="stat-pending">-</strong><span>待应用</span></div>
      </section>

      <section class="group-list" aria-labelledby="groups-heading">
        <div class="list-header">
          <h2 id="groups-heading">群列表</h2>
          <label class="search">
            <span class="sr-only">搜索群</span>
            <input id="search-input" type="search" placeholder="搜索群名称或 OpenID" autocomplete="off">
          </label>
        </div>
        <div class="batch-toolbar" id="batch-toolbar" hidden>
          <span>已选择 <strong id="selected-count">0</strong> 个群</span>
          <div class="batch-actions">
            <button class="button secondary" id="batch-edit-button" type="button">批量编辑</button>
            <button class="button" id="batch-sync-button" type="button">批量应用</button>
            <button class="text-button" id="clear-selection-button" type="button">清除选择</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="selection-column">
                  <label>
                    <span class="sr-only">选择当前筛选结果</span>
                    <input class="selection-checkbox" id="select-visible" type="checkbox" disabled>
                  </label>
                </th>
                <th>群</th>
                <th>审核方式</th>
                <th>绑定状态</th>
                <th>应用状态</th>
                <th class="actions-column">操作</th>
              </tr>
            </thead>
            <tbody id="group-rows">
              <tr><td class="empty" colspan="6">正在加载...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="group-list identity-list" aria-labelledby="identity-heading">
        <div class="list-header">
          <div>
            <h2 id="identity-heading">UID 身份与真人验证</h2>
            <p>有效 UID 与 QQ 身份唯一绑定；违规次数用于追溯消息审查记录。</p>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>B站 UID</th><th>QQ 身份</th><th>群</th><th>违规</th><th class="actions-column">操作</th></tr></thead>
            <tbody id="binding-rows"><tr><td class="empty" colspan="5">正在加载...</td></tr></tbody>
          </table>
        </div>
        <div class="sub-list-header"><h3>待真人验证</h3></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>成员</th><th>群 OpenID</th><th>原因</th><th class="actions-column">操作</th></tr></thead>
            <tbody id="suspicious-rows"><tr><td class="empty" colspan="4">正在加载...</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>

    <dialog id="edit-dialog">
      <form id="edit-form">
        <header class="dialog-header">
          <div>
            <h2 id="dialog-title">编辑群审核</h2>
            <p id="dialog-subtitle"></p>
          </div>
          <button class="close-button" id="close-dialog" type="button" aria-label="关闭">&times;</button>
        </header>

        <div class="form-grid">
          <label>
            <span>审核方式</span>
            <select id="mode" name="mode">
              <option value="off">关闭自动审核</option>
              <option value="conditional">条件审核</option>
              <option value="native">QQ 号码白名单</option>
            </select>
          </label>
          <label class="checkbox wide condition-field">
            <input id="uid-check-enabled" name="uid_check_enabled" type="checkbox">
            <span>检查 B站 UID</span>
          </label>
          <label class="checkbox wide condition-field">
            <input id="uid-exists-auto-approve" name="uid_exists_auto_approve" type="checkbox">
            <span>有效 UID 直接通过（全局及群级拒绝关键词仍优先）</span>
          </label>
          <label class="wide condition-field">
            <span>通过关键词（可选条件）</span>
            <textarea id="approve-keywords" name="approve_keywords" rows="3" placeholder="每行一个关键词"></textarea>
          </label>
          <label class="wide condition-field">
            <span>硬拒绝关键词</span>
            <textarea id="reject-keywords" name="reject_keywords" rows="3" placeholder="每行一个关键词"></textarea>
          </label>
          <label class="condition-field">
            <span>条件组合</span>
            <select id="condition-logic" name="condition_logic">
              <option value="all">全部满足</option>
              <option value="any">任一满足</option>
            </select>
          </label>
          <label class="condition-field">
            <span>条件未通过时</span>
            <select id="fallback-action" name="fallback_action">
              <option value="pending">保留待审</option>
              <option value="decline">拒绝申请</option>
              <option value="approve">同意申请</option>
            </select>
          </label>
          <label id="whitelist-field" class="wide conditional">
            <span>白名单 QQ 号码</span>
            <textarea id="whitelist" name="whitelist_qq_numbers" rows="5" placeholder="每行一个 QQ 号"></textarea>
          </label>
          <label class="wide">
            <span>按钮拒绝理由</span>
            <input id="reject-reason" name="button_reject_reason" maxlength="128" value="管理员拒绝">
          </label>
          <label class="checkbox wide" id="scan-field">
            <input id="scan-pending" name="scan_pending" type="checkbox">
            <span>应用白名单策略后扫描待审申请</span>
          </label>
          <div class="section-title wide">兜底验证</div>
          <label class="checkbox wide">
            <input id="fallback-human-verify-enabled" type="checkbox">
            <span>兜底同意的用户必须完成群内真人验证</span>
          </label>
          <div class="section-title wide">群消息审查</div>
          <label class="checkbox">
            <input id="moderation-enabled" type="checkbox">
            <span>启用消息审查</span>
          </label>
          <label class="checkbox">
            <input id="moderation-exempt-admins" type="checkbox">
            <span>群主和管理员免审</span>
          </label>
          <label class="wide">
            <span>消息撤回关键词</span>
            <textarea id="message-reject-keywords" rows="3" placeholder="每行一个关键词"></textarea>
          </label>
          <label class="checkbox">
            <input id="ai-review-enabled" type="checkbox">
            <span>AI 内容审核</span>
          </label>
          <label class="checkbox">
            <input id="image-spam-enabled" type="checkbox">
            <span>连续发图检测</span>
          </label>
          <label><span>连续图片数量</span><input id="image-spam-count" type="number" min="2" max="20"></label>
          <label><span>发图时间窗（秒）</span><input id="image-spam-window" type="number" min="3" max="120"></label>
          <label class="checkbox wide">
            <input id="repeat-review-enabled" type="checkbox">
            <span>集中复读检测并随机禁言参与者</span>
          </label>
          <label><span>复读触发次数</span><input id="repeat-count" type="number" min="3" max="20"></label>
          <label><span>复读时间窗（秒）</span><input id="repeat-window" type="number" min="5" max="120"></label>
          <label><span>随机禁言最短秒数</span><input id="repeat-mute-min" type="number" min="1" max="2592000"></label>
          <label><span>随机禁言最长秒数</span><input id="repeat-mute-max" type="number" min="1" max="2592000"></label>
          <div class="section-title wide">B站推送</div>
          <label class="wide"><span>UP 主 UID</span><textarea id="bilibili-uids" rows="3" placeholder="每行一个 UID"></textarea></label>
          <label class="checkbox"><input id="bilibili-dynamic-enabled" type="checkbox"><span>推送动态</span></label>
          <label class="checkbox"><input id="bilibili-live-enabled" type="checkbox"><span>推送开播和下播</span></label>
        </div>

        <footer class="dialog-actions">
          <button class="button secondary" id="cancel-edit" type="button">取消</button>
          <button class="button" id="save-button" type="submit">保存</button>
        </footer>
      </form>
    </dialog>

    <dialog id="batch-edit-dialog">
      <form id="batch-edit-form">
        <header class="dialog-header">
          <div>
            <h2>批量编辑群审核</h2>
            <p>仅覆盖明确选择的字段，其余配置保持不变。</p>
          </div>
          <button class="close-button" id="close-batch-dialog" type="button" aria-label="关闭">&times;</button>
        </header>

        <div class="form-grid">
          <label>
            <span>审核方式</span>
            <select id="batch-mode">
              <option value="">不修改</option>
              <option value="off">关闭自动审核</option>
              <option value="conditional">条件审核</option>
              <option value="native">QQ 号码白名单</option>
            </select>
          </label>
          <label><span>兜底真人验证</span><select id="batch-fallback-human-verify"><option value="">不修改</option><option value="true">开启</option><option value="false">关闭</option></select></label>
          <label><span>消息审查</span><select id="batch-moderation-enabled"><option value="">不修改</option><option value="true">开启</option><option value="false">关闭</option></select></label>
          <label><span>管理员免审</span><select id="batch-moderation-exempt-admins"><option value="">不修改</option><option value="true">开启</option><option value="false">关闭</option></select></label>
          <label><span>AI 审核</span><select id="batch-ai-review-enabled"><option value="">不修改</option><option value="true">开启</option><option value="false">关闭</option></select></label>
          <label><span>连续发图检测</span><select id="batch-image-spam-enabled"><option value="">不修改</option><option value="true">开启</option><option value="false">关闭</option></select></label>
          <label><span>复读检测</span><select id="batch-repeat-review-enabled"><option value="">不修改</option><option value="true">开启</option><option value="false">关闭</option></select></label>
          <label><span>动态推送</span><select id="batch-bilibili-dynamic-enabled"><option value="">不修改</option><option value="true">开启</option><option value="false">关闭</option></select></label>
          <label><span>直播推送</span><select id="batch-bilibili-live-enabled"><option value="">不修改</option><option value="true">开启</option><option value="false">关闭</option></select></label>
          <label>
            <span>检查 B站 UID</span>
            <select id="batch-uid-check-enabled">
              <option value="">不修改</option>
              <option value="true">开启</option>
              <option value="false">关闭</option>
            </select>
          </label>
          <label>
            <span>有效 UID 直接通过</span>
            <select id="batch-uid-exists-auto-approve">
              <option value="">不修改</option>
              <option value="true">开启</option>
              <option value="false">关闭</option>
            </select>
          </label>
          <label>
            <span>条件组合</span>
            <select id="batch-condition-logic">
              <option value="">不修改</option>
              <option value="all">全部满足</option>
              <option value="any">任一满足</option>
            </select>
          </label>
          <label>
            <span>条件未通过时</span>
            <select id="batch-fallback-action">
              <option value="">不修改</option>
              <option value="pending">保留待审</option>
              <option value="decline">拒绝申请</option>
              <option value="approve">同意申请</option>
            </select>
          </label>
          <label>
            <span>应用后扫描待审申请</span>
            <select id="batch-scan-pending">
              <option value="">不修改</option>
              <option value="true">开启</option>
              <option value="false">关闭</option>
            </select>
          </label>

          <fieldset class="batch-overwrite wide">
            <label class="checkbox">
              <input type="checkbox" data-controls="batch-whitelist" data-field="whitelist_qq_numbers">
              <span>覆盖白名单 QQ 号码</span>
            </label>
            <textarea id="batch-whitelist" rows="4" placeholder="每行一个 QQ 号" disabled></textarea>
          </fieldset>
          <fieldset class="batch-overwrite wide"><label class="checkbox"><input type="checkbox" data-controls="batch-message-keywords" data-field="message_reject_keywords"><span>覆盖消息撤回关键词</span></label><textarea id="batch-message-keywords" rows="3" disabled></textarea></fieldset>
          <fieldset class="batch-overwrite wide"><label class="checkbox"><input type="checkbox" data-controls="batch-bilibili-uids" data-field="bilibili_uids"><span>覆盖 B站 UP 主 UID</span></label><textarea id="batch-bilibili-uids" rows="3" disabled></textarea></fieldset>
          <fieldset class="batch-overwrite"><label class="checkbox"><input type="checkbox" data-controls="batch-image-count" data-field="image_spam_count"><span>覆盖连续图片数量</span></label><input id="batch-image-count" type="number" min="2" max="20" value="5" disabled></fieldset>
          <fieldset class="batch-overwrite"><label class="checkbox"><input type="checkbox" data-controls="batch-image-window" data-field="image_spam_window_seconds"><span>覆盖发图时间窗</span></label><input id="batch-image-window" type="number" min="3" max="120" value="15" disabled></fieldset>
          <fieldset class="batch-overwrite"><label class="checkbox"><input type="checkbox" data-controls="batch-repeat-count" data-field="repeat_count"><span>覆盖复读次数</span></label><input id="batch-repeat-count" type="number" min="3" max="20" value="4" disabled></fieldset>
          <fieldset class="batch-overwrite"><label class="checkbox"><input type="checkbox" data-controls="batch-repeat-window" data-field="repeat_window_seconds"><span>覆盖复读时间窗</span></label><input id="batch-repeat-window" type="number" min="5" max="120" value="30" disabled></fieldset>
          <fieldset class="batch-overwrite"><label class="checkbox"><input type="checkbox" data-controls="batch-mute-min" data-field="repeat_mute_min_seconds"><span>覆盖最短禁言秒数</span></label><input id="batch-mute-min" type="number" min="1" max="2592000" value="60" disabled></fieldset>
          <fieldset class="batch-overwrite"><label class="checkbox"><input type="checkbox" data-controls="batch-mute-max" data-field="repeat_mute_max_seconds"><span>覆盖最长禁言秒数</span></label><input id="batch-mute-max" type="number" min="1" max="2592000" value="600" disabled></fieldset>
          <fieldset class="batch-overwrite wide">
            <label class="checkbox">
              <input type="checkbox" data-controls="batch-approve-keywords" data-field="approve_keywords">
              <span>覆盖通过关键词</span>
            </label>
            <textarea id="batch-approve-keywords" rows="3" placeholder="每行一个关键词" disabled></textarea>
          </fieldset>
          <fieldset class="batch-overwrite wide">
            <label class="checkbox">
              <input type="checkbox" data-controls="batch-reject-keywords" data-field="reject_keywords">
              <span>覆盖硬拒绝关键词</span>
            </label>
            <textarea id="batch-reject-keywords" rows="3" placeholder="每行一个关键词" disabled></textarea>
          </fieldset>
          <fieldset class="batch-overwrite wide">
            <label class="checkbox">
              <input type="checkbox" data-controls="batch-reject-reason" data-field="button_reject_reason">
              <span>覆盖按钮拒绝理由</span>
            </label>
            <input id="batch-reject-reason" maxlength="128" value="管理员拒绝" disabled>
          </fieldset>
        </div>

        <footer class="dialog-actions">
          <button class="button secondary" id="cancel-batch-edit" type="button">取消</button>
          <button class="button" id="batch-save-button" type="submit">保存到所选群</button>
        </footer>
      </form>
    </dialog>

    <dialog id="confirm-dialog" class="confirm-dialog">
      <form method="dialog">
        <h2 id="confirm-title">确认操作</h2>
        <p id="confirm-text"></p>
        <div class="dialog-actions">
          <button class="button secondary" value="cancel">取消</button>
          <button class="button danger" id="confirm-button" value="confirm">确认</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
