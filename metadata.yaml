name: astrbot_plugin_qqgroup_admin
display_name: QQ 群聊管理
short_desc: QQ 官方群聊的入群审批、消息审查、撤回、禁言、关键词回复与 B 站推送。
desc: >-
  基于 QQ 官方机器人 OpenAPI 的群聊管理插件，支持群信息查询、成员禁言与解禁、
  入群申请按钮审批、QQ 号码白名单，以及由 B 站 UID、关键词、AND/OR 条件和
  兜底动作组成的多群自动审核；同时提供群消息审查、真人验证、UID 身份绑定、
  B 站动态与直播推送、关键词回复、最近消息撤回、全局 AI 主备审核、跨成员刷图检测、
  全局与单群成员黑白名单、QQ 原生群指令面板、群内设置按钮和独立 WebUI 管理页面。
version: 2.6.0
author: mgz0227
repo: https://github.com/mgz0227/QQGroup-admin
astrbot_version: ">=4.27.3,<5"
support_platforms:
  - qq_official
  - qq_official_webhook
